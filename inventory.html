<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/assets/logo.png">
        <title> Inventory </title>
    </head>
    <body>
       <nav class="navbar">
            <span class="navSideArea"> <button class="navSidebar"> <img class="menuIcon" src="assets/menu.png" alt="Sidebar"> </button> <br> </span>
            <button class="navlogoClick"> <img src="assets/logo.png" class="navlogo"> </button> 
            <!-- <img class="navPFP"> -->
            <!-- <p class="navRole"> Role: N/A</p> -->
            <div class="signoutArea">
                <p class="navName"> Name: N/A </p>
                <button class="navSignout"> <img class="signoutIcon" src="assets/signout.png" alt="Signout"> </button>
            </div>
        </nav>
        <div class="sidebar">
            <a href="home.html" class="sideHome"> Home </a>
            <a href="orders.html" class="sideOrders"> Orders </a>
            <a href="inventory.html" class="sideInventory"> Inventory </a>
            <a href="timeclock.html" class="sideShift"> Shift Managment </a>
            <a href="management.html" class="sideManagement"> Managment </a>
            <a href="accounting.html" class="sideAccounting"> Accounting </a>
        </div>
        <div class="mainPages">
            <div id="addIngTotal">
                <h4>Add Ingredients</h4>
                <form id="addIng">
                    <input id="ogName" placeholder="Item" required>
                    <input id="ogAmount" type="number" placeholder="Amount" required>
                    <input id="ogLow" type="number" placeholder="Low Threshold" required>
                    <input id="ogType" placeholder="Measurement" required>
                    <input id="ogPrice" placeholder="Price per Measurement" required>
                    <button id="ogAdd" type="submit"> + </button>
                </form>
            </div>
            <div id="addMenuTotal">
                <h4>Add Meal</h4>
                <form id="addMeal">
                    <input id="mealTitle" placeholder="Title" required>
                    <select id="mealType" class="heading4">
                        <option>Main</option>
                        <option>Appetizer</option>
                        <option>Beverage</option>
                        <option>Dessert</option>
                    </select>

                    <input id="mealImg" placeholder="Image Link">
                    <input id="mealPrice" placeholder="Price" required>
                    <button id="mealSub" class="heading4" type="submit">Add Meal</button>
                </form> 
            </div>
            
            <hr>
            <div id="viewArea">
                <h4> Inventory</h4>
                <div id="viewInventory">

                </div>
                <hr>
                <h4> Menu </h4>
                <div id="viewMenu">

                </div>
            </div>
        </div>
        <footer class="footer">
            <img src="assets/footerGIF.png" class="footerSonic">
        </footer>
        <script type="module" src="scriptcomp/navbar.js" defer></script>
        <script type="module" src="scriptcomp/sidebar.js" defer></script>
        <script type="module" src="inventory.js" defer></script>
    </body>
</html>
