<html>
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="styles.css" rel="stylesheet">
        <link rel="icon" type="image/x-icon" href="/assets/logo.png">
        <title> Inventory </title>
    </head>
    <body>
       <nav class="navbar">
            <span class="navSideArea"> <button class="navSidebar"> <img class="menuIcon" src="assets/menu.png" alt="Sidebar"> </button> <br> </span>
            <button class="navlogoClick"> <img src="assets/logo.png" class="navlogo"> </button> 
            <!-- <img class="navPFP"> -->
            <!-- <p class="navRole"> Role: N/A</p> -->
            <div class="signoutArea">
                <p class="navName"> Name: N/A </p>
                <button class="navSignout"> <img class="signoutIcon" src="assets/signout.png" alt="Signout"> </button>
            </div>
        </nav>
        <div class="sidebar">
            <a href="home.html" class="sideHome"> Home </a>
            <a href="orders.html" class="sideOrders"> Orders </a>
            <a href="inventory.html" class="sideInventory"> Inventory </a>
            <a href="management.html" class="sideManagement"> Management </a>
            <a href="accounting.html" class="sideAccounting"> Accounting </a>
        </div>
        <div class="mainPages">
            <form id="addMeal">
                <p>Add Meal</p>
                <input id="mealTitle" placeholder="Title" required><br>

                <select id="mealType">
                    <option>Main</option>
                    <option>Side</option>
                    <option>Drink</option>
                    <option>Dessert</option>
                </select><br>

                <input id="mealImg" placeholder="Image Link"><br>
                <input id="mealPrice" type="number" placeholder="Price" required><br>

                <div id="addIng">
                    <p>Ingredients</p> <button id="ingAdd" type="button">+</button>

                    <div class="ingRow">
                        <input class="ingName" placeholder="Item" required>
                        <input class="ingAmount" type="number" placeholder="Amount" required>
                        <select class="ingUnit">
                            <option>Tablespoons</option>
                            <option>Ounces</option>
                            <option>Grams</option>
                            <option>Pounds</option>
                        </select>
                    </div>
                </div>
                <button id="mealSub" type="submit">Add Meal</button>
            </form> 
            <div id="viewInventory">

            </div>
        </div>
        <script type="module" src="scriptcomp/navbar.js" defer></script>
        <script type="module" src="scriptcomp/sidebar.js" defer></script>
        <script type="module" src="inventory.js" defer></script>
    </body>
</html>
